<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">The browser calls Express, which mounts four routers. The left panel groups the application's files by layer and shows the separate printable invoice path. The right panel traces order placement from the browser to the JSON store and back.</desc>
  <defs>
    <style>
      text { font: 14px sans-serif; fill: #172638; }
      .title { font-size: 30px; font-weight: bold; }
      .section { font-size: 18px; font-weight: bold; }
      .file { font-size: 15px; font-weight: bold; }
      .detail { font-size: 13px; fill: #384d61; }
      .small { font-size: 12px; fill: #384d61; }
      .panel { fill: #ffffff; stroke: #cfdae4; }
      .card { fill: #eef4f9; stroke: #b8cbda; }
      .ticket { fill: #f4eaff; stroke: #9e6dc8; }
      .ticket-text { fill: #552580; }
      .edge { fill: none; stroke: #57748c; stroke-width: 1.5; }
      .invoice-edge { fill: none; stroke: #8053a8; stroke-width: 1.5; }
      .step { fill: #145a87; }
      .number { fill: #fff; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#57748c"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8053a8"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f5f8fb"/>
  <text x="32" y="47" class="title">ShopLedger architecture</text>
  <rect x="830" y="28" width="17" height="17" rx="3" class="ticket"/>
  <text x="855" y="41" class="small">Ticket module</text>
  <circle cx="991" cy="36" r="9" class="step"/>
  <text x="1008" y="41" class="small">Order placement step</text>

  <rect x="32" y="76" width="642" height="694" rx="12" class="panel"/>
  <text x="52" y="107" class="section">Application modules</text>

  <rect x="52" y="122" width="540" height="47" rx="6" class="card"/>
  <text x="65" y="142" class="file">public/</text>
  <text x="65" y="159" class="detail">Browser POS, order desk, Khata and reports · public/js/app.js</text>
  <path d="M322 169V190" class="edge" marker-end="url(#arrow)"/>
  <text x="333" y="184" class="small">HTTP</text>

  <rect x="52" y="191" width="540" height="61" rx="6" class="card"/>
  <text x="65" y="212" class="file">server.js</text>
  <text x="65" y="230" class="detail">Express serves public/ and mounts the four routers at /api</text>
  <text x="65" y="245" class="small ticket-text">GET /orders/:id/invoice loads the order and calls invoice.render()</text>

  <path d="M322 252V288" class="edge" marker-end="url(#arrow)"/>
  <text x="52" y="281" class="file">routes/</text>
  <rect x="52" y="291" width="540" height="98" rx="6" class="card"/>
  <text x="65" y="316" class="file">products.js</text>
  <text x="65" y="334" class="detail">Catalog and coupons</text>
  <text x="329" y="316" class="file">orders.js</text>
  <text x="329" y="334" class="detail">Place, list, view and cancel orders</text>
  <text x="65" y="358" class="file">customers.js</text>
  <text x="65" y="376" class="detail">Customer accounts and settlements</text>
  <text x="329" y="358" class="file">reports.js</text>
  <text x="329" y="376" class="detail">Dashboard, GST, pricing preview, export</text>

  <path d="M322 389V428" class="edge" marker-end="url(#arrow)"/>
  <text x="333" y="413" class="small">Call application logic</text>
  <text x="52" y="421" class="file">lib/</text>
  <rect x="52" y="430" width="540" height="242" rx="6" class="card"/>
  <text x="65" y="454" class="file">inventory.js</text>
  <text x="65" y="472" class="detail">Sellable stock and deductions</text>
  <text x="329" y="454" class="file">coupons.js</text>
  <text x="329" y="472" class="detail">Coupon validation and discounts</text>
  <text x="65" y="498" class="file">pricing.js</text>
  <text x="65" y="516" class="detail">Checkout totals and line GST</text>
  <text x="329" y="498" class="file">tax.js</text>
  <text x="329" y="516" class="detail">Checkout GST rates and split</text>
  <text x="65" y="542" class="file">ledger.js</text>
  <text x="65" y="560" class="detail">Khata balances and settlements</text>
  <text x="329" y="542" class="file">orders.js</text>
  <text x="329" y="560" class="detail">Order records and cancellation</text>
  <text x="65" y="586" class="file">dates.js</text>
  <text x="65" y="604" class="detail">Order dates and filter keys</text>
  <text x="329" y="586" class="file">reports.js</text>
  <text x="329" y="604" class="detail">Dashboard and invoice reconciliation</text>
  <text x="65" y="634" class="file">store.js</text>
  <text x="65" y="652" class="detail">JSON persistence and audit log</text>

  <rect x="320" y="615" width="260" height="47" rx="5" class="ticket"/>
  <text x="329" y="634" class="file ticket-text">invoice.js</text>
  <text x="329" y="652" class="detail ticket-text">Printable HTML and recalculated totals</text>
  <path d="M592 240H641V639H581" class="invoice-edge" marker-end="url(#purple-arrow)"/>
  <path d="M456 606V614" class="invoice-edge" marker-end="url(#purple-arrow)"/>

  <path d="M181 672V706" class="edge" marker-end="url(#arrow)"/>
  <text x="192" y="693" class="small">Read / rewrite</text>
  <rect x="52" y="707" width="256" height="45" rx="6" class="card"/>
  <text x="65" y="725" class="file">data/db.json</text>
  <text x="65" y="742" class="small">Products, orders, accounts, settlements, audit</text>
  <rect x="320" y="707" width="272" height="45" rx="6" class="card"/>
  <text x="329" y="725" class="file">config.js</text>
  <text x="329" y="742" class="small">Shared shop, GST and coupon settings</text>
  <path d="M456 707V674" class="edge" marker-end="url(#arrow)"/>

  <rect x="694" y="76" width="474" height="694" rx="12" class="panel"/>
  <text x="716" y="107" class="section">Placing an order</text>
  <path d="M731 153V704" class="edge" marker-end="url(#arrow)"/>

  <circle cx="731" cy="146" r="14" class="step"/>
  <text x="731" y="151" class="number">1</text>
  <text x="755" y="143" class="file">Submit the cart</text>
  <text x="755" y="163" class="detail">public/js/app.js sends POST /api/orders.</text>
  <text x="755" y="181" class="detail">server.js dispatches to routes/orders.js.</text>

  <circle cx="731" cy="227" r="14" class="step"/>
  <text x="731" y="232" class="number">2</text>
  <text x="755" y="224" class="file">Read data and check stock</text>
  <text x="755" y="244" class="detail">store.read() loads data/db.json.</text>
  <text x="755" y="262" class="detail">inventory.find() resolves catalog items.</text>
  <text x="755" y="280" class="detail">inventory.check() checks sellable stock.</text>

  <circle cx="731" cy="326" r="14" class="step"/>
  <text x="731" y="331" class="number">3</text>
  <text x="755" y="323" class="file">Price the sale</text>
  <text x="755" y="343" class="detail">pricing.subtotal() gives the pre-tax subtotal.</text>
  <text x="755" y="361" class="detail">coupons.normalizeCode() and validate() check the code.</text>
  <text x="755" y="379" class="detail">pricing.computeTotals() applies the discount and calls</text>
  <text x="755" y="397" class="detail">tax.getRateForItem() for GST on each discounted line.</text>

  <circle cx="731" cy="439" r="14" class="step"/>
  <text x="731" y="444" class="number">4</text>
  <text x="755" y="436" class="file">Charge Khata if selected</text>
  <text x="755" y="456" class="detail">ledger.findCustomer() resolves a supplied customer ID.</text>
  <text x="755" y="474" class="detail">ledger.chargeOrderToKhata() checks the credit limit</text>
  <text x="755" y="492" class="detail">and adds the checkout total to the account.</text>

  <circle cx="731" cy="535" r="14" class="step"/>
  <text x="731" y="540" class="number">5</text>
  <text x="755" y="532" class="file">Deduct stock and record the order</text>
  <text x="755" y="552" class="detail">inventory.reserve() deducts physical stock.</text>
  <text x="755" y="570" class="detail">orders.add() assigns an ID and calls dates.today().</text>
  <text x="755" y="588" class="detail">The order holds line snapshots and checkout totals.</text>

  <circle cx="731" cy="630" r="14" class="step"/>
  <text x="731" y="635" class="number">6</text>
  <text x="755" y="627" class="file">Persist the changes</text>
  <text x="755" y="647" class="detail">store.appendAudit() adds ORDER_CREATED.</text>
  <text x="755" y="665" class="detail">store.write() saves the order, stock, audit entry</text>
  <text x="755" y="683" class="detail">and any Khata changes to data/db.json.</text>

  <circle cx="731" cy="719" r="14" class="step"/>
  <text x="731" y="724" class="number">7</text>
  <text x="755" y="716" class="file">Return HTTP 201</text>
  <text x="755" y="736" class="detail">The UI shows the saved total and a link to the invoice.</text>
</svg>
